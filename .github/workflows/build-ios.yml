name: Build OpenMinis iOS

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Ignore incremental-build cache (force a clean compile)'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/build-ios.yml"
      - "src/ios/**"
      - "deps/**"
      - "scripts/**"
      - "BUILDING.md"

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ── Native deps (cached) ────────────────────────────────────────────────
      # Restored BEFORE the toolchain steps on purpose: the brew packages and the
      # Metal toolchain are only needed when the deps actually get (re)built from
      # source. On a warm cache this skips ~5-7 minutes of setup per run.
      - name: Cache native deps
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: openminis-deps-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh') }}

      - name: Install native build tools
        if: steps.deps.outputs.cache-hit != 'true'
        # No `brew update`: it costs 2-4 minutes and the preinstalled formula
        # index on the runner image is sufficient for these stable packages.
        run: |
          brew install ninja llvm libarchive pkg-config go
          python3 -m pip install --user meson

      - name: Install Metal toolchain
        if: steps.deps.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Prepare build-time configuration
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build LAME
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./deps/build_lame.sh

      - name: Build FFmpeg
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./deps/build_ish.sh

      - name: Prepare Alpine root filesystem
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build iOS rclone framework
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./deps/build_rclone_ios.sh

      # ── App build (incremental) ─────────────────────────────────────────────
      - name: Restore DerivedData
        if: inputs.fresh != true
        uses: actions/cache@v4
        with:
          # Only what an incremental build needs: object files, products and the
          # resolved SPM checkouts. Index.noindex and Logs are skipped.
          path: |
            build/DerivedData/Build
            build/DerivedData/SourcePackages
          key: dd-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('src/ios/**/*.swift','src/ios/Minis.xcodeproj/**') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ github.ref_name }}-
            dd-${{ runner.os }}-

      - name: Build OpenMinis iOS app
        env:
          IDEBuildOperationMaxNumberOfConcurrentCompileTasks: 12
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log

      - name: Build summary
        if: always()
        run: |
          LOG=build/xcodebuild.log
          [ -f "$LOG" ] || exit 0
          W=$(grep -c 'warning:' "$LOG" || true)
          E=$(grep -c 'error:' "$LOG" || true)
          echo "warnings=${W:-0} errors=${E:-0}" >> $GITHUB_STEP_SUMMARY
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY

      - name: Package unsigned app build
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/Minis.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/OpenMinis-iOS-unsigned-app.zip
          ls -lh build/OpenMinis-iOS-unsigned-app.zip
          echo "zip=$(du -m build/OpenMinis-iOS-unsigned-app.zip | cut -f1)MB" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-iOS-unsigned-app
          path: build/OpenMinis-iOS-unsigned-app.zip
          if-no-files-found: error
          retention-days: 7