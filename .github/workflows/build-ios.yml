name: Build OpenMinis iOS

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ios.yml"
      - "src/ios/**"
      - "deps/**"
      - "scripts/**"
      - "BUILDING.md"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install native build tools
        run: |
          brew update
          brew install ninja llvm libarchive pkg-config go
          python3 -m pip install --user meson

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Prepare build-time configuration
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build LAME
        run: ./deps/build_lame.sh

      - name: Build FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        run: ./deps/build_ish.sh

      - name: Prepare Alpine root filesystem
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build iOS rclone framework
        run: ./deps/build_rclone_ios.sh

      - name: Build OpenMinis iOS app
        run: |
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned app build
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/Minis.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/OpenMinis-iOS-unsigned-app.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-iOS-unsigned-app
          path: build/OpenMinis-iOS-unsigned-app.zip
          if-no-files-found: error
          retention-days: 7
